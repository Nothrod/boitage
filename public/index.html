<!DOCTYPE html>
<html lang="fr">

<head>

    <!--
    |--------------------------------------------------------------------------
    | Map Boitage - Connexion
    |--------------------------------------------------------------------------
    |
    | Fichier : public/index.html
    |
    | Rôle :
    | Page de connexion de l'application.
    |
    | Fonctionnalités :
    | - Connexion utilisateur
    | - Accès à la récupération de mot de passe
    |
    | Après connexion :
    | -> redirection vers /backend.html
    |
    |--------------------------------------------------------------------------
    -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Map Boitage - Connexion</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!--
            |--------------------------------------------------------------------------
            | Titre
            |--------------------------------------------------------------------------
            -->

            <h1>📬 Map Boitage</h1>

            <p class="subtitle">
                Suivi des campagnes de distribution
            </p>

            <!--
            |--------------------------------------------------------------------------
            | Formulaire de connexion
            |--------------------------------------------------------------------------
            -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Identifiant
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                    >

                </div>
				
				

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>
				
				

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Se connecter
                </button>

            </form>
			
			<p class="small-link">
    <a href="#" id="registerLink">Demander un compte</a>
</p>

<form id="registerForm" style="display: none; margin-top: 20px;">
    <hr>
    <h3 style="margin-top: 0;">Demande de création de compte</h3>
    
    <div class="form-group">
        <label for="registerName">Nom complet</label>
        <input type="text" id="registerName" required>
    </div>

    <div class="form-group">
        <label for="registerUsername">Identifiant souhaité</label>
        <input type="text" id="registerUsername" required>
    </div>

    <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" required>
        <small class="muted">Vous recevrez un email lors de la validation de votre compte.</small>
    </div>

    <div class="form-group">
        <label>Équipe(s)</label>
        <div id="registerTeams" class="checkbox-list">
            <p class="muted">Chargement des équipes...</p>
        </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">
        Soumettre la demande
    </button>

    <div id="registerMessage" class="message"></div>
</form>

            <!--
            |--------------------------------------------------------------------------
            | Mot de passe oublié
            |--------------------------------------------------------------------------
            |
            | Permet de générer un lien de réinitialisation.
            |
            |--------------------------------------------------------------------------
            -->

            <div class="forgot-password">

                <a
                    href="#"
                    id="forgotPasswordLink"
                >
                    Mot de passe oublié ?
                </a>

            </div>

            <!--
            |--------------------------------------------------------------------------
            | Formulaire de récupération
            |--------------------------------------------------------------------------
            |
            | Caché par défaut.
            | Affiché via login.js lors du clic sur le lien.
            |
            |--------------------------------------------------------------------------
            -->

            <form
                id="forgotPasswordForm"
                style="display:none;"
            >

                <div class="form-group">

                    <label for="forgotUsername">
                        Identifiant du compte
                    </label>

                    <input
                        type="text"
                        id="forgotUsername"
                        autocomplete="username"
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-secondary"
                >
                    Générer un lien de réinitialisation
                </button>

            </form>

            <!--
            |--------------------------------------------------------------------------
            | Zone de message
            |--------------------------------------------------------------------------
            |
            | Affichage :
            | - erreurs
            | - succès
            | - lien de réinitialisation
            |
            |--------------------------------------------------------------------------
            -->

            <div
                id="message"
                class="message"
            ></div>

        </div>

    </div>

    <!--
    |--------------------------------------------------------------------------
    | Javascript
    |--------------------------------------------------------------------------
    -->

    <script src="/login.js"></script>
	<script src="register.js"></script>

</body>

</html>
